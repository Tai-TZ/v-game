[project]
name = "v-game-backend"
version = "0.1.0"
description = "V-Game backend API: campus zones, levels and (later) agent compilation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "langgraph==1.2.14",
    "google-genai==2.28.0",
    "fastembed==0.8.1",
    "rank-bm25==0.2.2",
    "numpy==2.5.3",
    # /api/weather calls Open-Meteo; already locked through google-genai.
    "httpx==0.28.1",
]

[project.scripts]
# Precompute the 24 index variants, query embeddings and model files into ENGINE_CACHE_DIR.
vgame-build-index = "vgame.engine.index:main"

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vgame"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = ["slow: downloads/loads real models; run with `uv run pytest -m slow`"]
xfail_strict = true
filterwarnings = [
    "error",
    # httpx is pinned at 0.28.1; Starlette 1.7's TestClient prefers httpx2.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
    # Windows without Developer Mode: huggingface_hub falls back to copying model files.
    "ignore:`huggingface_hub` cache-system uses symlinks:UserWarning",
]
