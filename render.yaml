# Render Blueprint for the V-Game API on the free plan (512 MB, sleeps after 15 idle minutes).
# Create it once from the dashboard: New > Blueprint > this repository. Then set GEMINI_API_KEY
# in the service's Environment tab (it is never stored in git).
#
# Staying at $0 (Render has no spend cap; the Hobby workspace includes 750 free instance hours,
# 500 build minutes and 5 GB outbound bandwidth a month, and bills build/bandwidth overage):
# - plan: free only; no disks, databases, cron jobs or extra services in this file.
# - previews off: pull requests never spin up extra services.
# - deploys only for commits whose GitHub checks passed, and only when the API's inputs change
#   (backend/, the content it reads, this file), so frontend or docs merges cost no build minutes.
previews:
  generation: off

services:
  - type: web
    name: v-game-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # uv reads backend/.python-version and installs exactly what uv.lock pins.
    buildCommand: pip install uv==0.11.19 && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn --factory vgame.main:create_app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
        - docs/content/**
        - render.yaml
    envVars:
      - key: ENV
        value: production
      # gemini-3.8-flash's free quota on the owner's key is exhausted; flash-lite answers.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
