# Render Blueprint for the V-Game API on the free plan (512 MB, sleeps after 15 idle minutes).
# Create it once from the dashboard: New > Blueprint > this repository. Then set GEMINI_API_KEY
# in the service's Environment tab (it is never stored in git). Pushes to main redeploy.
services:
  - type: web
    name: v-game-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    # uv reads backend/.python-version and installs exactly what uv.lock pins.
    buildCommand: pip install uv==0.11.19 && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn --factory vgame.main:create_app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      # gemini-3.8-flash's free quota on the owner's key is exhausted; flash-lite answers.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
