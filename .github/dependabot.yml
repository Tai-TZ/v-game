version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Let new releases age before they are proposed (version updates only, not security fixes).
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
